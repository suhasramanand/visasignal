name: Ingest immigration data

on:
  schedule:
    # Offset minute (not :00) since GitHub's scheduler queues everything
    # scheduled for the top of the hour and can delay it under load.
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion pipeline
        run: python scripts/ingest.py

      - name: Commit updated data
        run: |
          git config user.name "visasignal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update ingested data [skip ci]"
          git push
